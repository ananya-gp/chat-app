<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #fff; height: 100vh; display: flex; }
    
    .sidebar {
      width: 240px;
      background: #161625;
      border-right: 1px solid #2a2a3d;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }
    .sidebar h2 {
      padding: 0 20px 20px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
    }
    .users-list { flex: 1; overflow-y: auto; padding: 0 10px; }
    .user-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    .user-item:hover { background: #1e1e30; }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      margin-right: 12px;
      color: #fff;
    }
    .user-name { font-size: 14px; }
    .online-count {
      padding: 15px 20px;
      border-top: 1px solid #2a2a3d;
      font-size: 12px;
      color: #888;
    }

    .main { flex: 1; display: flex; flex-direction: column; }
    .header {
      padding: 15px 25px;
      background: #161625;
      border-bottom: 1px solid #2a2a3d;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header h1 { font-size: 18px; font-weight: 600; flex: 1; }
    .header .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
    .share-btn {
      padding: 8px 16px;
      background: #2a2a3d;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .share-btn:hover { background: #3a3a4d; }
    .share-btn.copied { background: #2b9348; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 25px;
      scroll-behavior: smooth;
    }
    .message {
      display: flex;
      margin: 12px 0;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.mine { flex-direction: row-reverse; }
    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
      color: #fff;
    }
    .msg-content { max-width: 65%; }
    .msg-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .message.mine .msg-header { flex-direction: row-reverse; }
    .msg-name { font-size: 12px; font-weight: 600; }
    .msg-time { font-size: 11px; color: #666; }
    .msg-bubble {
      padding: 10px 16px;
      background: #1e1e30;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.mine .msg-bubble { background: #4338ca; }
    .system-msg {
      text-align: center;
      color: #666;
      font-size: 12px;
      padding: 8px 0;
      animation: fadeIn 0.3s ease;
    }

    #typing-indicator {
      padding: 8px 25px;
      font-size: 12px;
      color: #666;
      min-height: 28px;
    }

    #input-area {
      display: flex;
      padding: 20px 25px;
      background: #161625;
      border-top: 1px solid #2a2a3d;
      gap: 12px;
    }
    #message {
      flex: 1;
      padding: 14px 18px;
      background: #1e1e30;
      border: 1px solid #2a2a3d;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #message:focus { border-color: #4338ca; }
    #message::placeholder { color: #666; }
    #send {
      padding: 14px 24px;
      background: #4338ca;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s, transform 0.1s;
    }
    #send:hover { background: #5b4cdb; }
    #send:active { transform: scale(0.97); }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .login-box {
      background: #161625;
      padding: 40px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .login-box h2 { margin-bottom: 8px; font-size: 22px; }
    .login-box p { color: #888; margin-bottom: 24px; font-size: 14px; }
    .login-box input {
      width: 100%;
      padding: 14px 18px;
      background: #1e1e30;
      border: 1px solid #2a2a3d;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-box input:focus { border-color: #4338ca; }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: #4338ca;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
    }
    .login-box button:hover { background: #5b4cdb; }

    @media (max-width: 600px) {
      .sidebar { display: none; }
      #messages { padding: 15px; }
      #input-area { padding: 15px; }
    }
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2>Join Chat</h2>
      <p id="roomInfo">Room: general</p>
      <input type="text" id="nicknameInput" placeholder="Your nickname" maxlength="20" autofocus>
      <button id="joinBtn">Join Room</button>
    </div>
  </div>

  <div class="sidebar">
    <h2>Online</h2>
    <div class="users-list" id="usersList"></div>
    <div class="online-count" id="onlineCount">0 online</div>
  </div>

  <div class="main">
    <div class="header">
      <div class="dot"></div>
      <h1 id="roomTitle">General Chat</h1>
      <button class="share-btn" id="shareBtn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Share
      </button>
    </div>
    <div id="messages"></div>
    <div id="typing-indicator"></div>
    <div id="input-area">
      <input type="text" id="message" placeholder="Type a message..." disabled>
      <button id="send" disabled>Send</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('id') || 'general';
    const roomTitle = document.getElementById('roomTitle');
    const roomInfo = document.getElementById('roomInfo');
    const shareBtn = document.getElementById('shareBtn');

    roomTitle.textContent = `Room: ${roomId}`;
    roomInfo.textContent = `Room: ${roomId}`;

    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('send');
    const usersList = document.getElementById('usersList');
    const onlineCount = document.getElementById('onlineCount');
    const typingIndicator = document.getElementById('typing-indicator');
    const loginOverlay = document.getElementById('loginOverlay');
    const nicknameInput = document.getElementById('nicknameInput');
    const joinBtn = document.getElementById('joinBtn');

    let nickname = '';
    let ws;
    let typingTimeout;
    let myColor;

    function joinChat() {
      nickname = nicknameInput.value.trim();
      if (!nickname) return;
      loginOverlay.style.display = 'none';
      connect();
    }

    joinBtn.onclick = joinChat;
    nicknameInput.onkeypress = (e) => { if (e.key === 'Enter') joinChat(); };

    shareBtn.onclick = () => {
      const url = `${window.location.origin}/?id=${roomId}`;
      navigator.clipboard.writeText(url).then(() => {
        shareBtn.classList.add('copied');
        shareBtn.innerHTML = `
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          Copied!
        `;
        setTimeout(() => {
          shareBtn.classList.remove('copied');
          shareBtn.innerHTML = `
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            Share
          `;
        }, 2000);
      });
    };

    function connect() {
      ws = new WebSocket(`ws://${window.location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'join', username: nickname, room: roomId }));
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case 'history':
            myColor = msg.color;
            msg.messages.forEach(m => addMessage(m.username, m.text, m.color, m.created_at, false));
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            break;

          case 'message':
            addMessage(msg.username, msg.text, msg.color, msg.time, true);
            break;

          case 'system':
            addSystemMessage(msg.text, msg.time);
            break;

          case 'users':
            updateUsers(msg.users);
            break;

          case 'typing':
            typingIndicator.textContent = `${msg.username} is typing...`;
            break;

          case 'stopTyping':
            typingIndicator.textContent = '';
            break;
        }
      };

      ws.onclose = () => {
        messageInput.disabled = true;
        sendBtn.disabled = true;
        addSystemMessage('Disconnected. Refresh to reconnect.');
      };
    }

    function addMessage(user, text, color, time, isNew = true) {
      const isMine = user === nickname;
      const div = document.createElement('div');
      div.className = `message ${isMine ? 'mine' : ''}`;
      if (!isNew) div.style.animation = 'none';
      div.innerHTML = `
        <div class="msg-avatar" style="background:${color}">${user[0].toUpperCase()}</div>
        <div class="msg-content">
          <div class="msg-header">
            <span class="msg-name" style="color:${color}">${escapeHtml(user)}</span>
            <span class="msg-time">${time}</span>
          </div>
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>
      `;
      messagesDiv.appendChild(div);
      if (isNew) messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text, time) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = `${text} · ${time}`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUsers(users) {
      usersList.innerHTML = users.map(u => `
        <div class="user-item">
          <div class="user-avatar" style="background:${u.color}">${u.name[0].toUpperCase()}</div>
          <span class="user-name">${escapeHtml(u.name)}</span>
        </div>
      `).join('');
      onlineCount.textContent = `${users.length} online`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    const send = () => {
      const msg = messageInput.value.trim();
      if (msg && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'message', text: msg }));
        messageInput.value = '';
        ws.send(JSON.stringify({ type: 'stopTyping' }));
      }
    };

    messageInput.oninput = () => {
      ws.send(JSON.stringify({ type: 'typing' }));
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        ws.send(JSON.stringify({ type: 'stopTyping' }));
      }, 1000);
    };

    sendBtn.onclick = send;
    messageInput.onkeypress = (e) => { if (e.key === 'Enter') send(); };
  </script>
</body>
</html>
